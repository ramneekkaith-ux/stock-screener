name: Daily screen

on:
  schedule:
    # 05:20 UTC Tue-Sat = after each US/UK trading day (Mon-Fri) has closed.
    - cron: "20 5 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore fundamentals cache (from the `cache` branch)
        run: |
          mkdir -p data
          if git fetch --depth 1 origin cache 2>/dev/null; then
            git show origin/cache:cache.json.gz > data/cache.json.gz && ls -lh data/
          else
            echo "No cache yet - first run fetches everything"
          fi

      - name: Run screener
        run: python -m screener.run

      - name: Save fundamentals cache (single commit, no history)
        if: always()
        run: |
          [ -f data/cache.json.gz ] || exit 0
          tmp=$(mktemp -d); cp data/cache.json.gz "$tmp"/
          cd "$tmp"
          git init -q -b cache
          git add cache.json.gz
          git -c user.name=screener-bot -c user.email=actions@github.com commit -qm "cache $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" cache

      - name: Commit results
        run: |
          git config user.name screener-bot
          git config user.email actions@github.com
          git add results
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -qm "Screen results $(date -u +%F)"
          git pull -q --rebase
          git push -q
