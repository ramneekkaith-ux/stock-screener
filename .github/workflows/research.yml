name: Research packs

on:
  schedule:
    # Sundays 03:30 UTC: pick this week's candidates from the latest screen and build their packs.
    - cron: "30 3 * * 0"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space-separated tickers to build packs for (blank = top candidates from the screen)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: research-packs
  cancel-in-progress: false

jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pick candidates
        run: python -m research.select ${{ github.event.inputs.tickers }}
      - name: Build research packs
        run: python -m research.pack
      - name: Draw charts
        run: python -m research.charts
      - name: Commit packs
        run: |
          git config user.name screener-bot
          git config user.email actions@github.com
          git add research
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -qm "Research packs $(date -u +%F)"
          git pull -q --rebase
          git push -q
